<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding + KYC Chat | Delcaper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            max-height: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .message.user .message-avatar {
            background: #e0e0e0;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .message.error .message-content {
            background: #fee;
            border-left: 4px solid #d32f2f;
            color: #721c24;
        }

        .message.success .message-content {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #155724;
        }

        .message-content strong {
            font-weight: 600;
        }

        .message-content code {
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .message-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s;
        }

        .action-button:hover {
            transform: scale(1.05);
        }

        .chat-input-area {
            background: white;
            padding: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .input-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }

        .chat-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .chat-input.multiline {
            min-height: 80px;
            resize: vertical;
        }

        .input-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .send-button, .file-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-button {
            background: #f0f0f0;
            color: #333;
            position: relative;
        }

        .file-button:hover {
            background: #e0e0e0;
        }

        .file-input {
            display: none;
        }

        .file-selected {
            margin-top: 8px;
            padding: 8px 12px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remove-file {
            margin-left: auto;
            cursor: pointer;
            color: #d32f2f;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 16px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .hidden {
            display: none !important;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🚚 Delcaper Onboarding</h1>
            <p>Let's get you set up in minutes!</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be appended here -->
        </div>

        <div class="chat-input-area" id="inputArea">
            <label class="input-label" id="inputLabel">Enter your message</label>
            
            <input 
                type="text" 
                id="chatInput" 
                class="chat-input" 
                placeholder="Type your message..."
            />

            <div id="fileSelected" class="file-selected hidden">
                <span id="fileName">📎 No file selected</span>
                <span class="remove-file" onclick="removeFile()">✕</span>
            </div>

            <div class="input-actions">
                <button class="file-button" id="fileButton" onclick="triggerFileUpload()">
                    📎 Attach File
                </button>
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    Send
                </button>
            </div>

            <input type="file" id="fileInput" class="file-input" onchange="fileSelected()" />
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/onboarding';
        let sessionId = null;
        let currentInputType = 'text';
        let currentAcceptFiles = null;
        let selectedFile = null;

        // Initialize chat
        async function initChat() {
            try {
                const response = await fetch(`${API_BASE}/start`, {
                    method: 'POST'
                });

                const data = await response.json();
                
                if (data.success) {
                    sessionId = data.sessionId;
                    addMessage('assistant', data.text, data);
                    updateInputArea(data);
                }
            } catch (error) {
                console.error('Init error:', error);
                addMessage('error', 'Failed to start chat. Please refresh the page.');
            }
        }

        // Add message to chat
        function addMessage(type, text, data = {}) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';
            
            // Parse markdown-style formatting
            text = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/_(.*?)_/g, '<em>$1</em>');
            
            content.innerHTML = text;

            // Add action buttons if present
            if (data.actions && data.actions.length > 0) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                
                data.actions.forEach(action => {
                    const button = document.createElement('button');
                    button.className = 'action-button';
                    button.textContent = action.label;
                    button.onclick = () => handleAction(action.action);
                    actionsDiv.appendChild(button);
                });
                
                content.appendChild(actionsDiv);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            messagesDiv.appendChild(messageDiv);

            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Update input area based on response
        function updateInputArea(data) {
            const inputArea = document.getElementById('inputArea');
            const inputLabel = document.getElementById('inputLabel');
            const chatInput = document.getElementById('chatInput');
            const fileButton = document.getElementById('fileButton');
            const fileInput = document.getElementById('fileInput');

            // Update label
            inputLabel.textContent = data.inputLabel || 'Enter your message';

            // Update input type
            currentInputType = data.inputType || 'text';
            currentAcceptFiles = data.acceptFiles || null;

            // Reset
            chatInput.className = 'chat-input';
            fileButton.classList.remove('hidden');
            removeFile();

            if (data.inputType === 'file') {
                // File upload required
                chatInput.classList.add('hidden');
                fileButton.textContent = '📁 ' + (data.inputLabel || 'Upload File');
                fileInput.accept = data.acceptFiles || '*/*';
            } else if (data.inputType === 'multiline') {
                // Multi-line text input
                const textarea = document.createElement('textarea');
                textarea.id = 'chatInput';
                textarea.className = 'chat-input multiline';
                textarea.placeholder = data.inputLabel || 'Type your message...';
                chatInput.replaceWith(textarea);
            } else {
                // Regular text input
                chatInput.type = data.inputType === 'tel' ? 'tel' : 'text';
                chatInput.placeholder = data.inputLabel || 'Type your message...';
                
                if (data.mask === 'aadhaar') {
                    chatInput.placeholder = 'XXXX XXXX XXXX';
                    chatInput.maxLength = 14;
                } else if (data.mask === 'otp') {
                    chatInput.placeholder = 'XXXXXX';
                    chatInput.maxLength = 6;
                }
            }

            // Show/hide input area
            if (data.requiresInput === false) {
                inputArea.classList.add('hidden');
            } else {
                inputArea.classList.remove('hidden');
            }

            // Focus input
            setTimeout(() => {
                const currentInput = document.getElementById('chatInput');
                if (currentInput && !currentInput.classList.contains('hidden')) {
                    currentInput.focus();
                }
            }, 100);
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            let message = input.value.trim();

            // Check if file upload is required
            if (currentInputType === 'file' && selectedFile) {
                await uploadFile();
                return;
            }

            if (!message && !selectedFile) {
                return;
            }

            // Add user message
            addMessage('user', message);

            // Clear input
            input.value = '';

            // Show typing indicator
            showTyping();

            try {
                const response = await fetch(`${API_BASE}/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        message: message
                    })
                });

                const data = await response.json();
                hideTyping();

                if (data.success) {
                    const messageType = data.error ? 'error' : (data.success ? 'success' : 'assistant');
                    addMessage(messageType, data.text, data);
                    updateInputArea(data);
                } else {
                    addMessage('error', data.error || 'Something went wrong');
                }
            } catch (error) {
                hideTyping();
                console.error('Send error:', error);
                addMessage('error', 'Failed to send message. Please try again.');
            }
        }

        // Upload file (GST or other documents)
        async function uploadFile() {
            if (!selectedFile) return;

            addMessage('user', `📎 Uploading ${selectedFile.name}...`);
            showTyping();

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('sessionId', sessionId);

                const endpoint = currentInputType === 'file' && currentAcceptFiles?.includes('pdf') 
                    ? `${API_BASE}/upload-gst`
                    : `${API_BASE}/upload-file`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                hideTyping();

                if (data.success) {
                    if (data.text) {
                        // GST upload with auto-extracted data
                        addMessage('success', data.text, data);
                        updateInputArea(data);
                    } else if (data.url) {
                        // File upload - send URL as message
                        document.getElementById('chatInput').value = data.url;
                        await sendMessage();
                    }
                } else {
                    addMessage('error', data.error || 'Upload failed');
                }

                removeFile();
            } catch (error) {
                hideTyping();
                console.error('Upload error:', error);
                addMessage('error', 'Failed to upload file. Please try again.');
                removeFile();
            }
        }

        // File handling
        function triggerFileUpload() {
            document.getElementById('fileInput').click();
        }

        function fileSelected() {
            const fileInput = document.getElementById('fileInput');
            selectedFile = fileInput.files[0];

            if (selectedFile) {
                const fileSelectedDiv = document.getElementById('fileSelected');
                const fileName = document.getElementById('fileName');
                
                fileName.textContent = `📎 ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
                fileSelectedDiv.classList.remove('hidden');

                // If file input is required, auto-trigger upload
                if (currentInputType === 'file') {
                    uploadFile();
                }
            }
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileSelected').classList.add('hidden');
        }

        // Typing indicator
        function showTyping() {
            const messagesDiv = document.getElementById('chatMessages');
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator active';
            indicator.innerHTML = `
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;

            typingDiv.appendChild(avatar);
            typingDiv.appendChild(indicator);
            messagesDiv.appendChild(typingDiv);

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Action handlers
        function handleAction(action) {
            if (action === 'restart') {
                location.reload();
            } else if (action === 'retry') {
                sendMessage();
            } else if (action === 'login') {
                window.location.href = '/login';
            }
        }

        // Enter key to send
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                const input = document.getElementById('chatInput');
                if (input && input.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initChat);
    </script>
</body>
</html>
