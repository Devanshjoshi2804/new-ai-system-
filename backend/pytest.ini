[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    ai: AI component tests

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Coverage (optional)
# --cov=src
# --cov-report=html
# --cov-report=term-missing

